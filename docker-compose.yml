# Full local stack: Postgres + backend + frontend, all containerized.
# Usage:  docker compose up --build
# Dashboard: http://localhost:5173   API: http://localhost:8000

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: threatpulse
      POSTGRES_PASSWORD: threatpulse
      POSTGRES_DB: threatpulse
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threatpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://threatpulse:threatpulse@db:5432/threatpulse
      UPDATE_INTERVAL_HOURS: "6"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:
